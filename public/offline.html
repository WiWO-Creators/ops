<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F4F3EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161715" media="(prefers-color-scheme: dark)">
  <title>Sin conexión · WiWO Ops</title>
  <link rel="icon" href="/iconos/icono-192.png">
  <!--
    Página que sirve el service worker cuando una navegación falla por falta de red.
    Todo va en línea: sin red no hay otra hoja de estilos que pedir. Los colores son los literales de
    los tokens de `neo.css` (superficie, texto y acento en claro y oscuro).
  -->
  <style>
    :root {
      color-scheme: light dark;
      --superficie: #F4F3EE;
      --texto: #292929;
      --texto-tenue: #4F504A;
      --acento: #4242FF;
      --acento-contenido: #FFFFFC;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --superficie: #161715;
        --texto: #F8FAD7;
        --texto-tenue: #E2E4CA;
        --acento: #8c8cff;
        --acento-contenido: #292929;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
      background: var(--superficie);
      color: var(--texto);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      line-height: 1.5;
    }
    main { max-width: 22rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; text-align: center; }
    img { width: 4rem; height: 4rem; border-radius: 1rem; }
    h1 { margin: 0; font-size: 1.375rem; letter-spacing: -0.015em; line-height: 1.15; }
    p { margin: 0; color: var(--texto-tenue); font-size: 0.9375rem; }
    button {
      min-height: 2.75rem;
      padding: 0 1.5rem;
      border: 0;
      border-radius: 999px;
      background: var(--acento);
      color: var(--acento-contenido);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 100ms ease-out;
    }
    button:active { transform: scale(0.97); }
    button:focus-visible { outline: 3px solid var(--acento); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <img src="/iconos/icono-192.png" alt="" width="64" height="64">
    <h1>Sin conexión</h1>
    <p>No hay red en este momento. Cuando vuelva la conexión, Ops se carga solo.</p>
    <button type="button" id="reintentar">Reintentar</button>
  </main>
  <script>
    document.getElementById('reintentar').addEventListener('click', function () { location.reload() })
    window.addEventListener('online', function () { location.reload() })
  </script>
</body>
</html>
