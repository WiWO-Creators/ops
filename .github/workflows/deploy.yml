name: Deploy → ops.wiwo.me

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: SSH deploy
    runs-on: ubuntu-latest

    steps:
      - name: Deploy en servidor
        uses: appleboy/ssh-action@v1.2.0
        env:
          OPS_CRON_SECRET: ${{ secrets.OPS_CRON_SECRET }}
          OPS_TIMER_CUTOFF_HOUR: ${{ vars.OPS_TIMER_CUTOFF_HOUR }}
          OPS_CRON_BASE_URL: ${{ vars.OPS_CRON_BASE_URL }}
          OPS_CRON_REQUEST_TIMEOUT_MS: ${{ vars.OPS_CRON_REQUEST_TIMEOUT_MS }}
          OPS_CRON_POLL_SCHEDULE: ${{ vars.OPS_CRON_POLL_SCHEDULE }}
          OPS_CRON_LIVE_SCHEDULE: ${{ vars.OPS_CRON_LIVE_SCHEDULE }}
          OPS_CRON_TRASH_SCHEDULE: ${{ vars.OPS_CRON_TRASH_SCHEDULE }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          envs: OPS_CRON_SECRET,OPS_TIMER_CUTOFF_HOUR,OPS_CRON_BASE_URL,OPS_CRON_REQUEST_TIMEOUT_MS,OPS_CRON_POLL_SCHEDULE,OPS_CRON_LIVE_SCHEDULE,OPS_CRON_TRASH_SCHEDULE
          script: |
            set -e
            : "${OPS_CRON_SECRET:?Falta secret OPS_CRON_SECRET}"
            : "${OPS_TIMER_CUTOFF_HOUR:?Falta variable OPS_TIMER_CUTOFF_HOUR (HH:MM)}"
            : "${OPS_CRON_BASE_URL:?Falta variable OPS_CRON_BASE_URL}"
            test -d /run/systemd/system || { echo "Cron requiere systemd para reiniciar tras reboot" >&2; exit 1; }
            node --input-type=module <<'NODE'
            const env = process.env;
            if (env.OPS_CRON_SECRET.length < 32 || !/^(?:[01]\d|2[0-3]):[0-5]\d$/.test(env.OPS_TIMER_CUTOFF_HOUR)) {
              throw new Error('Cron: secret requiere 32 caracteres y hora HH:MM.');
            }
            const url = new URL(env.OPS_CRON_BASE_URL);
            if (url.protocol !== 'https:' || url.username || url.password || url.search || url.hash) {
              throw new Error('OPS_CRON_BASE_URL requiere HTTPS sin credenciales, query ni fragmento.');
            }
            for (const key of ['OPS_CRON_SECRET', 'OPS_TIMER_CUTOFF_HOUR', 'OPS_CRON_BASE_URL', 'OPS_CRON_REQUEST_TIMEOUT_MS', 'OPS_CRON_POLL_SCHEDULE', 'OPS_CRON_LIVE_SCHEDULE', 'OPS_CRON_TRASH_SCHEDULE']) {
              if (/[\r\n']/.test(env[key] ?? '')) throw new Error(`Formato no admitido: ${key}`);
            }
            if (env.OPS_CRON_REQUEST_TIMEOUT_MS && !/^[1-9]\d*$/.test(env.OPS_CRON_REQUEST_TIMEOUT_MS)) {
              throw new Error('OPS_CRON_REQUEST_TIMEOUT_MS requiere milisegundos enteros positivos.');
            }
            NODE
            cd /root/ops-v2
            # `reset --hard` y no `pull`: `pnpm build` reescribe `next-env.d.ts` en cada despliegue,
            # asi que el arbol del servidor queda sucio y el `pull` aborta con "your local changes
            # would be overwritten". Este checkout es un artefacto de despliegue, no un lugar donde
            # se edita: lo que vale siempre es `origin/main`. El `.env` no se toca —esta ignorado.
            git fetch origin main
            git reset --hard origin/main
            pnpm install --frozen-lockfile
            pnpm build
            # Solo Node lee este archivo privado; no se incorpora al bundle de Next.
            node --input-type=module <<'NODE'
            import { writeFileSync, renameSync } from 'node:fs';
            const keys = ['OPS_CRON_SECRET', 'OPS_TIMER_CUTOFF_HOUR', 'OPS_CRON_BASE_URL', 'OPS_CRON_REQUEST_TIMEOUT_MS', 'OPS_CRON_POLL_SCHEDULE', 'OPS_CRON_LIVE_SCHEDULE', 'OPS_CRON_TRASH_SCHEDULE'];
            const content = keys.filter(key => process.env[key]).map(key => `${key}='${process.env[key]}'`).join('\n') + '\n';
            writeFileSync('.env.cron.tmp', content, { mode: 0o600 });
            renameSync('.env.cron.tmp', '.env.cron');
            NODE
            node scripts/cron.mjs --check
            pm2 startup systemd -u root --hp /root
            systemctl is-enabled pm2-root
            pm2 startOrRestart ecosystem.cron.cjs --update-env
            pm2 restart ops-v2
            pm2 save
            chmod 600 /root/.pm2/dump.pm2
            if [ -f /root/.pm2/dump.pm2.bak ]; then chmod 600 /root/.pm2/dump.pm2.bak; fi
            systemctl start pm2-root
            systemctl is-active pm2-root
            echo "✅ Deploy completado"
